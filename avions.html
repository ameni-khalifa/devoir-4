<div class="container">
    <div class="card shadow nb-4">
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Id</th><th>Nom</th><th>Capacite</th><th>Date Mise En Service</th><th>Compagnie</th><th></th><th></th>
                    </tr>
                </thead>
                <tbody>
                    @for (avion of avions; track avion.idAvion) {
                    <tr>
                        <td>{{avion.idAvion}}</td>
                        <td>{{avion.modele}}</td>
                        <td>{{avion.capacite}}</td>
                        <td>{{avion.dateMiseEnService | date:'dd/MM/yyyy'}}</td>
                        <td>{{avion.compagnie.nomComp}}</td>
                        <td>
                            <a class="btn btn-danger btn-sm" (click)="supprimerAvion(avion)">Supprimer</a>
                        </td>
                        <td>
                            <a class="btn btn-success btn-sm" [routerLink]="['/update-avion', avion.idAvion]">Modifier</a>
                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
